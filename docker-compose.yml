# ============================================================================
# Local development stack.
#
# `docker compose up` starts:
#   - postgres 16 on :5432
#   - backend (Django dev server) on :8000 with hot-reload
#   - frontend (Next.js dev server) on :3000 with hot-reload
#
# Migrations run automatically when the backend starts. Source code is
# mounted as a volume so edits are picked up without rebuilding images.
#
# For production, use the individual Dockerfiles (see DEPLOYMENT.md) — NOT
# this compose file. Dev-server + mounted volumes is a local-only setup.
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smart_learning
      POSTGRES_PASSWORD: smart_learning
      POSTGRES_DB: smart_learning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db
      DB_NAME: smart_learning
      DB_USER: smart_learning
      DB_PASSWORD: smart_learning
      DB_PORT: 5432
      DJANGO_SECRET_KEY: dev-insecure-key-local-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        apt-get update && apt-get install -y --no-install-recommends
          build-essential libpq-dev libmagic1
        && rm -rf /var/lib/apt/lists/*
        && pip install --no-cache-dir -r requirements/dev.txt
        && pip install --no-cache-dir -e '.[dev]'
        && python manage.py migrate --noinput
        && python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: >
      sh -c "
        npm install
        && npm run dev
      "

volumes:
  pgdata:
  backend_static:
  backend_media:
  frontend_node_modules:
  frontend_next: