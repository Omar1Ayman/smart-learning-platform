name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_learning_test
          POSTGRES_USER: smart_learning
          POSTGRES_PASSWORD: smart_learning
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart_learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: flake8 apps config tests
      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DB_HOST: localhost
          DB_NAME: smart_learning_test
          DB_USER: smart_learning
          DB_PASSWORD: smart_learning
        run: python manage.py makemigrations --check --dry-run
      - name: Test
        env:
          DB_HOST: localhost
          DB_NAME: smart_learning_test
          DB_USER: smart_learning
          DB_PASSWORD: smart_learning
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check + build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build
