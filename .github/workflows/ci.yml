# ============================================================================
# CI — runs on every push to main/master and every pull request.
#
# Job purposes:
#   - backend: proves migrations work from scratch (the F-15 bug taught us
#     this matters), ruff lint, full pytest suite on real PostgreSQL.
#   - frontend: lint + production build, catches the whole class of
#     "unused import" / "set-state-in-effect" warnings from Batch 5.
#
# Total wall time on a fresh runner: ~3-4 minutes (deps cached).
# ============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smart_learning
          POSTGRES_PASSWORD: smart_learning
          POSTGRES_DB: smart_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (fresh DB — catches duplicate migrations)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DB_NAME: smart_learning
          DB_USER: smart_learning
          DB_PASSWORD: smart_learning
          DB_HOST: localhost
          DB_PORT: "5432"
        run: pytest --create-db -q --maxfail=1

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json is missing — using npm install"
            npm install
          fi

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (production)
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build