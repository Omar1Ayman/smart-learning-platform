[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-learning-platform"
version = "0.1.0"
description = "Multi-tenant Arabic-first Educational SaaS (backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Runtime deps are managed in requirements/base.txt for Docker/pip use.
# This block lists them again for `pip install -e .` users — keep in sync.
dependencies = [
    "Django==5.1.15",
    "django-cors-headers==4.4.0",
    "django-filter==24.3",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "psycopg2-binary==2.9.13",
    "PyJWT==2.14.0",
    "python-decouple==3.8",
    "python-magic==0.4.27",
    "pyotp==2.9.0",
    "openpyxl==3.1.5",
    "sentry-sdk[django]>=2.0,<3.0",
    "whitenoise>=6.7,<7.0",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "factory_boy==3.3.3",
    "Faker==40.39.0",
    "flake8==7.3.0",
    "pytest==8.4.2",
    "pytest-django==4.14.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    # F-09 FIX (Milestone 0): previously mypy's `plugins` list referenced
    # `mypy_django_plugin` but the package was never installed — every
    # `mypy .` run failed with "plugin not found". Adding the trio that
    # makes Django type-checking actually work.
    "django-stubs>=5.0,<6.0",
    "django-stubs-ext>=5.0,<6.0",
    "mypy-django>=1.0,<2.0",
]

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
# F-08 FIX (Milestone 0): these flags used to live here but were silently
# ignored because `pytest.ini` (a plain-text file) overrides pyproject.toml
# entirely. Deleted that file; pyproject is now the sole source of truth.
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | migrations
  | media
  | staticfiles
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps", "config", "tests"]
exclude = ["migrations", ".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "C4",
    "DJ",
    "UP",
    "S",
    "RUF",
]
ignore = [
    # F-14 FIX (Milestone 0): previously also had "S101" globally, which
    # meant `assert` in production code was also exempt from the security
    # lint. That's dangerous — `assert` disappears under `python -O` and
    # can silently break validation. Moved to per-file-ignores below, so
    # it only applies to tests.
    "S105", "S106",  # hardcoded-password-string — checked-in test factories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]     # assert, passwords, random
"apps/*/migrations/*" = ["E501"]
"config/settings/dev.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
django_settings_module = "config.settings.test"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main"]
# F-09 FIX (Milestone 0): removed the duplicate
# `[tool.mypy.django_settings_module]` section that followed this one — it
# was interpreted as a separate config table and had no effect. The value
# above is the effective one.