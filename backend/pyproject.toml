[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-learning-backend"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "factory-boy",
    "ruff",
    "mypy",
    "django-stubs",
]

# ========================================================================
# 🔥 ده الجزء اللي كان ناقص واللي بيحل المشكلة 🔥
# ========================================================================
[tool.setuptools.packages.find]
include = ["apps*", "config*"]

# ========================================================================
# إعدادات الأدوات (Ruff / Mypy / Pytest)
# ========================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E741",  # Ambiguous variable name 'l'
    "B904",  # raise without from (we'll fix later)
    "B905",  # zip without strict
    "B023",  # Function def loop var
    "B018",  # Useless expression
    "E402",  # Import not at top of file
    "F403",  # Star imports (settings files)
    "F405",  # Undefined from star imports (settings files)
    "DJ001", # null=True on CharField
    "DJ012", # Django style order (magic methods)
    "F841",  # Unused local variables (mostly in tests)
    "B007",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "F"]
"*/tests/*" = ["B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["migrations", ".venv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-v --strict-markers --reuse-db"